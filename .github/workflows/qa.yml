name: Houshyar Autonomous Guardian
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply safe automatic repairs
        if: github.event_name != 'pull_request'
        run: npm run agent:repair
      - name: Save safe repairs to repository
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain -- .gitignore wrangler.toml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .gitignore wrangler.toml
            git commit -m "chore(agent): apply safe configuration repairs"
            git push
          else
            echo "No repair commit required."
          fi
      - name: Project and secret-safety diagnostics
        run: npm run agent:check
      - name: Automated tests
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Report failure as GitHub issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Houshyar Guardian: automated check failed";
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(issue => issue.title === title && !issue.pull_request)) {
              core.info("An open guardian issue already exists; not creating a duplicate.");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                "The autonomous Houshyar guardian detected a failed check.",
                "",
                "Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
                "Commit: " + context.sha,
                "",
                "Only allowlisted safe configuration repairs are automatic. Application logic, credentials, and Cloudflare account settings are never modified automatically."
              ].join("\n")
            });
