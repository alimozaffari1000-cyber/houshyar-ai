name: Houshyar Autonomous Guardian
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Least privilege: CI reads source and may open a diagnostic issue only.
permissions:
  contents: read
  issues: write

concurrency:
  group: houshyar-guardian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Project and secret-safety diagnostics
        run: npm run agent:check
      - name: Automated tests
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Report failure as GitHub issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Houshyar Guardian: automated check failed";
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(issue => issue.title === title && !issue.pull_request)) {
              core.info("An open guardian issue already exists; not creating a duplicate.");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                "The autonomous Houshyar guardian detected a failed check.",
                "",
                "Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
                "Commit: " + context.sha,
                "",
                "The guardian runs with read-only repository contents access. It never changes application files, credentials, or Cloudflare settings."
              ].join("\n")
            });
