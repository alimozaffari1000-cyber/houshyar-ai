name: Houshyar Project Guardian
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Project agent diagnostics
        run: npm run agent:check
      - name: Automated tests
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Report failure as GitHub issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Houshyar Guardian: automated check failed";
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(issue => issue.title === title && !issue.pull_request)) {
              core.info("An open guardian issue already exists; not creating a duplicate.");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                "The automated Houshyar project guardian detected a failed check.",
                "",
                "Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
                "Commit: " + context.sha,
                "",
                "This report is diagnostic; Cloudflare account settings and API secrets cannot be changed by this workflow."
              ].join("\n")
            });
