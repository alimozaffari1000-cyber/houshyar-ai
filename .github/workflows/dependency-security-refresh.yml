name: Houshyar Dependency Security Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: houshyar-dependency-security-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    name: Refresh vulnerable dependency resolutions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate a reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible security updates
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Install exactly the reviewed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require a clean high-severity dependency audit
        run: npm audit --audit-level=high

      - name: Run project tests
        run: npm run qa

      - name: Verify production build
        run: npm run build

      - name: Propose dependency and lockfile updates
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/dependency-security-refresh
          delete-branch: true
          commit-message: "chore(deps): refresh audited npm lockfile"
          title: "Houshyar: refresh and audit npm dependency lockfile"
          body: |
            This draft pull request was generated by the dependency security refresh workflow.

            It creates or updates the npm lockfile and applies compatible npm security fixes.
            The workflow requires a clean high-severity audit, passing project tests, and a
            successful production build before proposing the changes.

            Review the dependency diff and CI results before merging. No production deployment
            or automatic merge is performed.
          draft: true
