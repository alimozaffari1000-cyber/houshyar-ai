name: Houshyar quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/modular-agent-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm run qa
      - name: Build production bundle
        run: npm run build
