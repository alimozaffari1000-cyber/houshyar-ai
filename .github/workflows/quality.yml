name: Houshyar Quality and Performance Agent
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Automated tests
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Quality, accessibility and bundle-budget audit
        run: npm run quality:check
      - name: Report quality failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Houshyar Quality Agent: review required";
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            if (existing.data.some(issue => issue.title === title && !issue.pull_request)) {
              core.info("An open quality issue already exists; skipping duplicate.");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                "The Houshyar Quality and Performance Agent found a failed test, build, or quality budget.",
                "",
                "Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
                "Commit: " + context.sha,
                "",
                "Review the failed workflow logs. This agent reports issues; it does not rewrite or deploy production code automatically."
              ].join("\n")
            });
