name: Import Houshyar source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract package
        run: |
          test -f houshyar-ai-v0.5-qa.zip
          unzip -oq houshyar-ai-v0.5-qa.zip -d /tmp/houshyar
          cp -R /tmp/houshyar/houshyar-ai-v0.3/. .
          rm houshyar-ai-v0.5-qa.zip
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Houshyar AI v0.5 source and QA"
          git push
