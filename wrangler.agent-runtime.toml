name = "houshyar-agent-runtime"
main = "workers/agent-runtime.js"
compatibility_date = "2026-11-08"
[triggers]
crons = ["*/5 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "houshyar-agent-runtime-staging"
database_id = "REPLACE_WITH_STAGING_DATABASE_ID"
[vars]
AGENT_RUNTIME_ENABLED = "false"
